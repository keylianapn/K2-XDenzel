<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#031019"><title>K2@DENZEL — Gaming Store</title>
<style>
:root{--bg:#02080d;--panel:#06141d;--cyan:#00e5ff;--line:#087b96;--muted:#8ba5af}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#06475b,#02080d 40%);color:#f4fbff;font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:#020b12ee;backdrop-filter:blur(14px);border-bottom:1px solid #07556a}.nav{max-width:1250px;margin:auto;padding:13px 20px;display:flex;gap:16px;align-items:center}.logo{font-size:24px;font-weight:950;white-space:nowrap}.logo b{color:var(--cyan)}.logo small{display:block;color:var(--muted);font-size:9px;letter-spacing:3px}
.search{height:46px;display:flex;align-items:center;flex:1;background:#06141e;border:1px solid #096a81;border-radius:13px;padding:0 13px}.search input{width:100%;border:0;outline:0;background:none;color:white;padding:10px}.cart,.primary{background:var(--cyan);color:#001015;border:0;border-radius:12px;padding:12px 16px;font-weight:900}
.hero{max-width:1250px;margin:22px auto;padding:0 20px}.heroBox{border:1px solid #087f9b;border-radius:25px;min-height:300px;padding:34px;background:linear-gradient(115deg,#06131d,#06384a 55%,#00e5ff20);position:relative;overflow:hidden}.heroBox:after{content:"";position:absolute;width:420px;height:420px;right:-120px;top:-130px;border-radius:50%;background:#00e5ff22;filter:blur(25px)}.eyebrow{color:var(--cyan);font-weight:900;letter-spacing:3px}h1{font-size:clamp(42px,7vw,76px);line-height:.92;margin:9px 0;position:relative;z-index:1}h1 span{color:var(--cyan)}.hero p{max-width:600px;color:#b6cbd3;line-height:1.5;position:relative;z-index:1}
.cats{max-width:1250px;margin:auto;padding:0 20px 10px;display:flex;gap:9px;overflow:auto}.chip{border:1px solid #08647b;background:#06141e;color:#d8f8ff;border-radius:999px;padding:10px 15px;white-space:nowrap}.chip.active,.chip:hover{background:var(--cyan);color:#001015}
.section{max-width:1250px;margin:auto;padding:8px 20px 60px}.head{display:flex;justify-content:space-between;align-items:end;margin:15px 0}.head h2{font-size:30px;margin:0}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:linear-gradient(180deg,#081a25,#041016);border:1px solid #07556a;border-radius:18px;overflow:hidden;transition:.2s;box-shadow:0 8px 30px #0009}.card:hover{transform:translateY(-4px);border-color:var(--cyan)}.pic{width:100%;height:205px;border:0;background:#020c12;position:relative;display:block;padding:0}.pic img{width:100%;height:100%;object-fit:contain;padding:15px}.badge{position:absolute;top:10px;left:10px;background:#00151ddd;color:var(--cyan);border:1px solid #00e5ff66;border-radius:8px;padding:5px 8px;font-size:9px;font-weight:900}.body{padding:14px}.stars{color:#00e5ff;font-size:12px}.stars span{color:#66818c}.card h3{font-size:16px;min-height:40px;margin:8px 0}.stock{color:#51d9a2;font-size:12px;margin:5px 0 9px}.price{color:var(--cyan);font-weight:950;font-size:22px;margin-bottom:11px}.add{width:100%;border:0;background:#083444;color:#fff;border-radius:11px;padding:11px;font-weight:900}.add:hover{background:var(--cyan);color:#001015}
.overlay{position:fixed;inset:0;background:#000b;z-index:50;display:none}.overlay.show{display:block}.drawer{position:absolute;right:0;top:0;width:min(430px,94vw);height:100%;background:#041018;border-left:1px solid var(--line);padding:20px;overflow:auto}.close{float:right;border:0;background:none;color:#fff;font-size:28px}.cartitem{display:grid;grid-template-columns:65px 1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid #124252}.cartitem img{width:65px;height:60px;object-fit:contain;background:#061a25;border-radius:9px}.qty{display:flex;gap:7px;align-items:center;margin-top:7px}.qty button{width:27px;height:27px;border:0;border-radius:7px;background:#00d9f5}.total{display:flex;justify-content:space-between;border-top:1px solid #15576a;margin-top:18px;padding-top:16px;font-size:21px}
.modal{position:fixed;inset:0;background:#000c;z-index:60;display:none;place-items:center;padding:20px}.modal.show{display:grid}.modalbox{width:min(760px,100%);background:#04131c;border:1px solid var(--line);border-radius:22px;overflow:hidden}.detail{display:grid;grid-template-columns:1fr 1fr}.detail img{width:100%;height:410px;object-fit:contain;background:#020a0f;padding:25px}.info{padding:28px}.info h2{font-size:31px}.big{font-size:31px;color:var(--cyan);font-weight:950}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,120px);background:#071b26;border:1px solid var(--cyan);padding:13px 17px;border-radius:13px;z-index:100;transition:.25s}.toast.show{transform:translate(-50%,0)}footer{border-top:1px solid #0a3e4d;text-align:center;padding:30px 20px;color:#78909a}.notice{font-size:11px;color:#718d99;line-height:1.5}
@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.nav{flex-wrap:wrap;padding:12px}.search{order:3;flex-basis:100%}.hero{padding:0 12px}.heroBox{padding:25px;min-height:290px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.pic{height:155px}.body{padding:10px}.card h3{font-size:14px}.price{font-size:19px}.detail{grid-template-columns:1fr}.detail img{height:260px}.info{padding:20px}}@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="nav"><div class="logo">K2@<b>DENZEL</b><small>GAMING STORE</small></div><label class="search">⌕ <input id="search" placeholder="Rechercher un produit..." oninput="render()"></label><button class="cart" onclick="openCart()">🛒 Panier <span id="cc">0</span></button></div></header>
<section class="hero"><div class="heroBox"><div><div class="eyebrow">K2@DENZEL</div><h1>TON SETUP.<br><span>TON GAME.</span></h1><p>Consoles, accessoires, PC gaming, téléphones, jeux et cartes cadeaux.</p><button class="primary" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">Découvrir la boutique →</button></div></div></section>
<div class="cats" id="cats"></div><section class="section" id="products"><div class="head"><h2>Produits</h2><span class="muted" id="count"></span></div><div class="grid" id="grid"></div></section>
<footer><b>K2@DENZEL</b> — Gaming Store<br><span class="notice">Prototype : aucun paiement réel, aucune transaction bancaire.</span></footer>
<div class="overlay" id="ov" onclick="if(event.target===this)closeCart()"><aside class="drawer"><button class="close" onclick="closeCart()">×</button><h2>Mon panier</h2><div id="items"></div><div class="total"><span>Total</span><b id="total">0,00 €</b></div><button class="primary" style="width:100%;margin-top:18px" onclick="checkout()">Passer la commande</button><p class="notice">Paiement simulé uniquement.</p></aside></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeProduct()"><div class="modalbox" id="detail"></div></div><div class="toast" id="toast"></div>
<script>
const img="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=900&q=85";
const names=[
["PlayStation 5 Slim Digital","Consoles",499.99],["PlayStation 5 Slim","Consoles",549.99],["PlayStation 5 Pro","Consoles",799.99],["Xbox Series X","Consoles",499.99],["Xbox Series S","Consoles",349.99],["Nintendo Switch OLED","Consoles",349.99],["Nintendo Switch Lite","Consoles",229.99],["Steam Deck OLED","Consoles",569.99],["PlayStation Portal","Consoles",219.99],["Meta Quest 3S","Consoles",329.99],
["DualSense PS5 Blanc","Accessoires",69.99],["DualSense PS5 Noir","Accessoires",74.99],["DualSense Edge","Accessoires",219.99],["Manette Xbox","Accessoires",59.99],["Manette Nintendo Pro","Accessoires",69.99],["HyperX Cloud II","Accessoires",89.99],["HyperX Cloud III","Accessoires",109.99],["Logitech G Pro X Superlight","Accessoires",129.99],["Souris gaming RGB","Accessoires",49.99],["Clavier mécanique RGB","Accessoires",89.99],["Webcam Gaming","Accessoires",79.99],["Micro USB Gaming","Accessoires",69.99],["Carte de capture 4K","Accessoires",119.99],["Station recharge DualSense","Accessoires",29.99],["Tapis XXL RGB","Accessoires",39.99],["Chaise Gaming","Accessoires",179.99],["Bureau Gaming","Accessoires",149.99],["Lampe LED Gaming","Accessoires",29.99],["Support casque RGB","Accessoires",34.99],["Ventilateur RGB","Accessoires",49.99],
["PC Gamer RTX 4060","PC Gaming",1099.99],["PC Gamer RTX 4070","PC Gaming",1499.99],["PC Gamer RX 7800 XT","PC Gaming",1399.99],["Écran Gaming 27 144Hz","PC Gaming",249.99],["Écran Gaming 27 240Hz","PC Gaming",329.99],["SSD NVMe 1 To","PC Gaming",79.99],["SSD NVMe 2 To","PC Gaming",139.99],["RAM DDR5 32 Go RGB","PC Gaming",109.99],["Alimentation 750W","PC Gaming",99.99],["Support écran","PC Gaming",59.99],
["Samsung Galaxy S23 FE","Téléphones",599.99],["Samsung Galaxy S24","Téléphones",799.99],["iPhone 15","Téléphones",699.99],["iPhone 16","Téléphones",899.99],["Xiaomi Redmi Note 13","Téléphones",249.99],
["Carte PlayStation Store 50 €","Cartes cadeaux",50],["Carte Xbox 50 €","Cartes cadeaux",50],["Carte Nintendo eShop 50 €","Cartes cadeaux",50],["Carte Steam 50 €","Cartes cadeaux",50],["Carte Amazon 50 €","Cartes cadeaux",50]
];
const products=names.map((x,i)=>({id:i+1,name:x[0],cat:x[1],price:x[2],img:img}));
let cat="Tous",cart=JSON.parse(localStorage.getItem("k2denzel_cart")||"[]");
const cats=["Tous","Consoles","Accessoires","PC Gaming","Téléphones","Cartes cadeaux"];
document.getElementById("cats").innerHTML=cats.map(c=>`<button class="chip ${c==="Tous"?"active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
function euro(n){return n.toLocaleString("fr-FR",{style:"currency",currency:"EUR"})}
function setCat(c){cat=c;document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("active",b.textContent===c));render()}
function render(){let q=document.getElementById("search").value.toLowerCase();let list=products.filter(p=>(cat==="Tous"||p.cat===cat)&&p.name.toLowerCase().includes(q));document.getElementById("count").textContent=list.length+" produit"+(list.length>1?"s":"");document.getElementById("grid").innerHTML=list.map(p=>`<article class="card"><button class="pic" onclick="openProduct(${p.id})"><span class="badge">K2@DENZEL</span><img src="${p.img}" alt="${p.name}"></button><div class="body"><div class="stars">★★★★★ <span>avis clients</span></div><h3>${p.name}</h3><div class="stock">● En stock</div><div class="price">${euro(p.price)}</div><button class="add" onclick="add(${p.id})">Ajouter au panier</button></div></article>`).join("")}
function save(){localStorage.setItem("k2denzel_cart",JSON.stringify(cart));document.getElementById("cc").textContent=cart.reduce((s,x)=>s+x.q,0)}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1800)}
function add(id){let x=cart.find(a=>a.id===id);x?x.q++:cart.push({id,q:1});save();toast("✓ Ajouté au panier")}
function openCart(){document.getElementById("ov").classList.add("show");let b=document.getElementById("items");if(!cart.length)b.innerHTML='<p class="muted">Ton panier est vide.</p>';else b.innerHTML=cart.map(x=>{let p=products.find(a=>a.id===x.id);return `<div class="cartitem"><img src="${p.img}"><div><b>${p.name}</b><div style="color:var(--cyan)">${euro(p.price)}</div><div class="qty"><button onclick="change(${p.id},-1)">−</button>${x.q}<button onclick="change(${p.id},1)">+</button></div></div><button class="close" style="font-size:18px" onclick="removeItem(${p.id})">🗑</button></div>`}).join("");let t=cart.reduce((s,x)=>s+products.find(p=>p.id===x.id).price*x.q,0);document.getElementById("total").textContent=euro(t)}
function closeCart(){document.getElementById("ov").classList.remove("show")}
function change(id,d){let x=cart.find(a=>a.id===id);if(!x)return;x.q+=d;if(x.q<=0)cart=cart.filter(a=>a.id!==id);save();openCart()}
function removeItem(id){cart=cart.filter(a=>a.id!==id);save();openCart()}
function openProduct(id){let p=products.find(a=>a.id===id);document.getElementById("detail").innerHTML=`<button class="close" onclick="closeProduct()">×</button><div class="detail"><img src="${p.img}" alt="${p.name}"><div class="info"><div class="eyebrow">${p.cat}</div><h2>${p.name}</h2><p class="muted">Produit présenté dans la boutique K2@DENZEL.</p><p class="big">${euro(p.price)}</p><p style="color:#51d9a2">● En stock</p><button class="primary" style="width:100%" onclick="add(${p.id});closeProduct()">Ajouter au panier</button></div></div>`;document.getElementById("modal").classList.add("show")}
function closeProduct(){document.getElementById("modal").classList.remove("show")}
function checkout(){if(!cart.length)return toast("Panier vide");toast("Débit simulé — aucun paiement réel")}
render();save();
</script></body></html>
